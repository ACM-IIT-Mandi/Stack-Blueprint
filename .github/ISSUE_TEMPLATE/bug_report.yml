name: Bug report
description: Something in a blueprint, or in the repo itself, is not working
title: "<blueprint or area>: <what is wrong>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        If this is a security problem, please don't use this form. Instead use the Security
        tab on this repo and choose "Report a vulnerability". See
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: input
    id: where
    attributes:
      label: Where
      description: Which blueprint, or which part of the repo.
      placeholder: blueprints/backend/fastapi-rest
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what actually happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1. `git clone ...`
        2. `cd blueprints/...`
        3. `cp .env.example .env`
        4. `make ...`
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Paste the actual error or log rather than a screenshot, it's easier to search.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Your setup
      value: |
        - OS:
        - Docker version:
        - Running via Docker, or natively:
